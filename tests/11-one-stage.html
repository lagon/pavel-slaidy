<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1520px;height:960px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>{L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
  const p=document.getElementById('out')||document.body.appendChild(Object.assign(document.createElement('pre'),{id:'out'}));
  p.textContent=L.join('\n');};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (f.contentWindow.__ready||wait(3500)); await wait(120); const w=W.__api;
 try{
  // pick a slide with a figure AND body text — the case that used to differ
  const i=w.S.slides.findIndex(x=>w.firstFig(x)&&
    (x.body||'').replace(/!\[\[[^\]]*\]\]/g,'').trim().length>40);
  ok('found a slide with a figure and text',i>=0,'slide '+(i+1));
  w.cur=i;w.paint();await wait(300);

  const st=d.querySelector('#sheet .stage');
  ok('the board renders a stage',!!st);
  ok('the stage is exactly 1280x720',st.offsetWidth===1280&&st.offsetHeight===720,
     st.offsetWidth+'x'+st.offsetHeight);
  const k=st.getBoundingClientRect().width/1280;
  ok('and it is scaled to fit the board',k>0.4&&k<1,k.toFixed(3));

  // capture what the board shows
  const boardHtml=st.innerHTML;
  const boardTx=d.querySelector('#sheet .stage .tx');
  ok('the body is inside the frame now, not below it',!!boardTx&&
     !d.querySelector('#sheet .offstage:not(.notes)'));

  // measure the board before present mode hides it
  const norm=el=>[...el.querySelectorAll('.hdr,h2,.stack,.fg,.tx')].map(x=>{
    const r=x.getBoundingClientRect(),p=x.closest('.stage').getBoundingClientRect(),s=p.width/1280;
    const key=x.tagName==='H2'?'h2':x.className.trim();
    return key+':'+Math.round((r.left-p.left)/s)+','+Math.round((r.top-p.top)/s)
           +','+Math.round(r.width/s)+'x'+Math.round(r.height/s);
  });
  const a=norm(st);
  const boardTop=(st.querySelector('.tx').getBoundingClientRect().top-st.getBoundingClientRect().top)
                 /(st.getBoundingClientRect().width/1280);
  const boardH=st.querySelector('.tx').getBoundingClientRect().height
               /(st.getBoundingClientRect().width/1280);
  const boardFs=[getComputedStyle(st.querySelector('.tx')).fontSize,
                 getComputedStyle(st.querySelector('h2')).fontSize];

  // a link on a slide has to be clickable while presenting — that is where a
  // reader follows one, not in the editor
  const keepBody=w.S.slides[i].body;
  w.S.slides[i].body='See [the demo](https://example.org/demo), a bare one: https://example.org/raw '+
    'and one in brackets: <https://example.org/angle>';
  w.paint();await wait(250);
  const boardLink=d.querySelector('#sheet .tx a');
  ok('a markdown link renders as a link',!!boardLink&&/example\.org\/demo/.test(boardLink.href),
     boardLink&&boardLink.getAttribute('href'));
  const hrefs=()=>[...d.querySelectorAll('#sheet .tx a')].map(a=>a.getAttribute('href'));
  ok('and a bare url becomes one too',hrefs().some(h=>/example\.org\/raw/.test(h)),hrefs().join(' '));
  ok('and markdown\'s own <url> form, which is what a closing slide is written in',
     hrefs().some(h=>/example\.org\/angle/.test(h)),hrefs().join(' '));
  ok('the angle brackets do not survive as text',
     !/&lt;https|<https/.test(d.querySelector('#sheet .tx').innerHTML));

  // now present the same slide
  await w.present(true);await wait(400);
  const shown=[...d.querySelectorAll('#deck .tx a')];
  ok('the links are there when projected',shown.length>=3,shown.length+' links');
  if(shown.length){
    const a=shown[0],r=a.getBoundingClientRect();
    const hit=d.elementFromPoint(Math.round(r.left+r.width/2),Math.round(r.top+r.height/2));
    ok('and nothing is lying on top of them',!!hit&&(hit===a||a.contains(hit)||hit.closest('a')===a),
       hit?hit.tagName+'.'+(hit.className||''):'nothing there');
    ok('they open in a new tab, so the talk is not navigated away',
       a.target==='_blank'&&/noopener/.test(a.rel||''),a.target+' '+a.rel);
    // and a click while presenting is intercepted, so it does not open a tab
    // behind a full-screen page where nobody can see it
    let opened=null;
    const realOpen=W.open; W.open=(u)=>{opened=u;return null;};
    a.dispatchEvent(new W.MouseEvent('click',{bubbles:true,cancelable:true}));
    await wait(300);
    ok('clicking one while presenting actually opens it',opened===a.href,String(opened));
    ok('and the deck is still presented',w.showing!==false&&
       d.getElementById('show').classList.contains('on'),'F goes back to full screen');
    W.open=realOpen;
  }
  // back to the real body without leaving the presenter — toggling it twice is
  // what hung this file, and the rest of the test needs to stay presented
  w.S.slides[i].body=keepBody;w.paintDeck();await wait(300);
  const dk=d.getElementById('deck');
  ok('present renders the same stage class',dk.className===st.className,
     `board "${st.className}" vs deck "${dk.className}"`);
  ok('present is 1280x720 too',dk.offsetWidth===1280&&dk.offsetHeight===720,
     dk.offsetWidth+'x'+dk.offsetHeight);

  const b=norm(dk);
  ok('same elements in both',a.length===b.length,a.length+' vs '+b.length);
  const diff=a.map((x,j)=>x===b[j]?null:`${x}  ≠  ${b[j]}`).filter(Boolean);
  ok('every box lands in the same place',diff.length===0,diff.slice(0,2).join('  |  '));

  // the text block specifically — this is what used to jump to the top
  const dp=dk.getBoundingClientRect(),ds=dp.width/1280;
  const deckTop=(dk.querySelector('.tx').getBoundingClientRect().top-dp.top)/ds;
  const deckH=dk.querySelector('.tx').getBoundingClientRect().height/ds;
  ok('the text starts at the same height',Math.abs(boardTop-deckTop)<2,
     'board '+boardTop.toFixed(0)+'  deck '+deckTop.toFixed(0));
  ok('and is the same height',Math.abs(boardH-deckH)<2,
     'board '+boardH.toFixed(0)+'  deck '+deckH.toFixed(0));
  const fs=x=>getComputedStyle(x).fontSize;
  ok('and at the same type size',boardFs[0]===fs(dk.querySelector('.tx')),
     boardFs[0]+' vs '+fs(dk.querySelector('.tx')));
  ok('titles match too',boardFs[1]===fs(dk.querySelector('h2')),
     boardFs[1]+' vs '+fs(dk.querySelector('h2')));
  await w.present(false);await wait(150);

  // --- a figure in a column beside text in another ---
  const si=w.S.slides.findIndex(x=>w.firstFig(x)&&
    (x.body||'').replace(/!\[\[[^\]]*\]\]/g,'').trim());
  ok('found a slide with a figure and text',si>=0,'slide '+(si+1));
  w.cur=si;
  w.S.slides[si].layout='two';
  if(!/<!-- col -->/.test(w.S.slides[si].body))
    w.S.slides[si].body=w.S.slides[si].body.replace(/(!\[\[[^\]]*\]\])/,'$1\n\n<!-- col -->');
  w.paint();await wait(300);
  const s2=d.querySelector('#sheet .stage'), p2=s2.getBoundingClientRect(), k2=p2.width/1280;
  const areas=s2.querySelectorAll('.area');
  ok('two columns are drawn',areas.length===2,String(areas.length));
  ok('the figure is in the first and the words in the second',
     !!areas[0].querySelector('.inlinefig svg')&&areas[1].textContent.trim().length>0,
     areas[1].textContent.trim().slice(0,30));
  ok('and they sit side by side',
     areas[1].getBoundingClientRect().left>areas[0].getBoundingClientRect().right-2);

  // --- figure size ---
  const w0=s2.querySelector('.inlinefig svg').getBoundingClientRect().width;
  w.setFigSize(w.S.slides[si],0,60);w.paint();await wait(250);
  const s3=d.querySelector('#sheet .stage');
  const w1=s3.querySelector('.inlinefig svg').getBoundingClientRect().width;
  ok('figure size shrinks it',w1<w0*0.75,Math.round(w0)+' → '+Math.round(w1));
  ok('and it survives markdown',/\|60%\]\]/.test(w.slideMd(w.S.slides[si])),
     (w.slideMd(w.S.slides[si]).match(/!\[\[[^\]]*\]\]/)||[''])[0]);
  const rt2=w.importMarkdown('x.md','# A\n\n'+w.slideMd(w.S.slides[si]));
  ok('and comes back',/!\[\[[^\]|]+\|60%\]\]/.test(rt2[0].body),
     (rt2[0].body.match(/!\[\[[^\]]*\]\]/)||[''])[0]);
  w.setFigSize(w.S.slides[si],0,100);w.paint();await wait(150);

  // the PDF draws the same stage
  const tmp=d.createElement('div');tmp.innerHTML=w.printSlide(w.S.slides[i],false);
  ok('print uses the stage as well',!!tmp.querySelector('.psl .stage'));
  ok('print markup matches the board',
     tmp.querySelector('.stage').className===st.className,tmp.querySelector('.stage').className);
  // ---------- portrait PDF: an A4 sheet per slide, the slide across the top ----------
  const realPrint=W.print;let printed=0;W.print=()=>{printed++;};
  w.toPdf(false,true);await wait(600);
  const pr=d.getElementById('printroot'),pages=[...pr.querySelectorAll('.psl')];
  ok('portrait prints one page per slide',pages.length===w.S.slides.length,
     pages.length+' pages, '+w.S.slides.length+' slides');
  ok('every page is a portrait one',pages.every(x=>x.classList.contains('portrait')));
  ok('and the print dialog opened',printed===1,String(printed));
  const pg=d.getElementById('printpage');
  ok('the page size is A4 portrait for this print',!!pg&&/size:\s*210mm 297mm/.test(pg.textContent),
     pg?pg.textContent:'no page rule');
  pr.style.display='block';
  const sec=pages[0].getBoundingClientRect(),ps=pages[0].querySelector('.stage').getBoundingClientRect();
  ok('the sheet is taller than it is wide, in A4 proportion',Math.abs(sec.height/sec.width-297/210)<0.01,
     Math.round(sec.width)+'x'+Math.round(sec.height));
  ok('the slide spans the width of the sheet',Math.abs(ps.width-sec.width)<2,
     Math.round(ps.width)+' vs '+Math.round(sec.width));
  ok('and sits at the top, keeping its shape',Math.abs(ps.top-sec.top)<1&&Math.abs(ps.height/ps.width-720/1280)<0.01,
     'top '+Math.round(ps.top-sec.top)+', '+Math.round(ps.width)+'x'+Math.round(ps.height));
  pr.style.display='';
  W.dispatchEvent(new W.Event('afterprint'));
  ok('after printing the page size goes back to landscape',!d.getElementById('printpage')&&!pr.innerHTML);
  w.toPdf(false);await wait(600);
  ok('and a landscape PDF is not portrait',!d.getElementById('printpage')&&
     !pr.querySelector('.portrait')&&pr.querySelectorAll('.psl').length===w.S.slides.length);
  W.dispatchEvent(new W.Event('afterprint'));
  // ---------- portrait with notes: the slide on top, its notes below ----------
  const ni=w.S.slides.findIndex(x=>(x.notes||'').trim());
  const keepNotes=w.S.slides[ni>=0?ni:0].notes;
  if(ni<0)w.S.slides[0].notes='Say this out loud, and follow [the paper](https://example.org/p).';
  const nj=ni>=0?ni:0;
  const bare=w.S.slides.findIndex(x=>!(x.notes||'').trim());
  printed=0;w.toPdf(true,true);await wait(600);
  const npages=[...pr.querySelectorAll('.psl')];
  ok('portrait with notes prints one page per slide',npages.length===w.S.slides.length,
     npages.length+' pages, '+w.S.slides.length+' slides');
  ok('every page is portrait and carries notes',npages.every(x=>x.classList.contains('portrait')&&
     x.classList.contains('withnotes')));
  ok('the page size is A4 portrait here too',!!d.getElementById('printpage')&&printed===1);
  pr.style.display='block';
  const np=npages[nj],nsec=np.getBoundingClientRect(),nst=np.querySelector('.stage').getBoundingClientRect(),
        pn=np.querySelector('.pn');
  ok('a slide with notes has them on its page',!!pn&&pn.textContent.includes(
     w.S.slides[nj].notes.trim().replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').slice(0,20)),pn?pn.textContent.slice(0,60):'no notes');
  ok('the slide keeps the full width, not the landscape shrink',Math.abs(nst.width-nsec.width)<2&&
     Math.abs(nst.top-nsec.top)<1,Math.round(nst.width)+' vs '+Math.round(nsec.width));
  const pr_=pn&&pn.getBoundingClientRect();
  ok('and the notes sit below the slide, inside the sheet',!!pr_&&pr_.top>=nst.bottom&&
     pr_.bottom<=nsec.bottom+1&&pr_.height>nsec.height*0.4,
     pr_?'notes '+Math.round(pr_.top-nsec.top)+'..'+Math.round(pr_.bottom-nsec.top)+', slide ends '+
       Math.round(nst.bottom-nsec.top):'');
  ok('a link in the notes stays a link',!pn||!/\]\(/.test(w.S.slides[nj].notes)||!!pn.querySelector('a'));
  if(bare>=0)ok('a slide without notes gets the slide alone',!npages[bare].querySelector('.pn'));
  pr.style.display='';
  W.dispatchEvent(new W.Event('afterprint'));
  ok('after printing it goes back to landscape',!d.getElementById('printpage')&&!pr.innerHTML);
  w.toPdf(true);await wait(600);
  ok('and landscape with notes is unchanged',!d.getElementById('printpage')&&
     !pr.querySelector('.portrait')&&pr.querySelectorAll('.psl.withnotes').length===w.S.slides.length);
  W.dispatchEvent(new W.Event('afterprint'));
  w.S.slides[nj].notes=keepNotes;W.print=realPrint;
  // ---------- a centred row keeps its figure ----------
  // Centring stops the figure column stretching, and the figure sizes itself
  // from that column's height — so it collapsed to nothing and simply was not
  // there. Found by looking at the demo deck, not by the suite.
  const ci=si;
  w.cur=ci;w.S.slides[ci].flags=[];w.setFigSize(w.S.slides[ci],0,100);w.paint();await wait(350);
  const fw=()=>{const v=d.getElementById('stage').querySelector('.inlinefig svg');
    return v?Math.round(v.getBoundingClientRect().width):0;};
  const plain=fw();
  ok('a figure in a column has a width',plain>50,plain+'px');
  w.S.slides[ci].flags=['center'];w.paint();await wait(350);
  ok('centring the row does not collapse it',fw()>50,fw()+'px');
  ok('and leaves it the same size',Math.abs(fw()-plain)<6,fw()+' vs '+plain);
  ok('the row really is centred',
     /\bmid\b/.test(d.getElementById('stage').querySelector('.stack').className));
  w.S.slides[ci].flags=[];w.paint();await wait(200);

 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
